<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
  <title th:text="${title}">Admin</title>
  <style>
    /* Важно: чтобы padding не увеличивал общую ширину элементов */
    * {
        box-sizing: border-box;
    }

    body {
        font-family: sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
        background-color: #f8f9fa;
    }

    .sidebar {
        width: 250px;
        background-color: #ffffff;
        border-right: 1px solid #e1e4e8;
        padding: 20px;
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 5px rgba(0,0,0,0.03);
    }

    .sidebar h3 {
        color: #2c3e50;
        margin-bottom: 5px;
        font-size: 1.4em;
        font-weight: bold;
    }
    .sidebar .subtitle {
        color: #959da5;
        font-size: 0.9em;
        margin-bottom: 30px;
        display: block;
    }

    .sidebar a {
        color: #586069;
        text-decoration: none;
        padding: 12px 15px;
        margin-bottom: 5px;
        display: block;
        transition: 0.2s;
        border-radius: 6px;
        font-weight: 500;
    }
    .sidebar a:hover { background-color: #f1f3f5; color: #0366d6; }
    .sidebar a.active { background-color: #ebf5ff; color: #0366d6; font-weight: 600; }

    .main-content { flex-grow: 1; padding: 40px; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; margin-bottom: 30px; align-items: center; }

    /* Общий стиль для всех кнопок действий (Найти, Создать, Сброс) */
    .btn {
        padding: 8px 16px;
        background: #0366d6;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-size: 0.9em;
        transition: 0.2s;
        display: inline-block;
    }
    .btn:hover { background: #0255b3; }

    /* Специальный стиль для кнопки выхода в меню */
    .logout-link {
        margin-top: 10px;
        background-color: #dc3545 !important; /* Красный фон */
        color: white !important; /* Белый текст */
        text-align: center;
        font-weight: 600;
        display: block; /* Занимает всю ширину контейнера */
    }
    .logout-link:hover {
        background-color: #bb2d3b !important; /* Темнее при наведении */
        color: white !important;
    }
  </style>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.css" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

  <script th:inline="javascript">
    /*<![CDATA[*/
    var socket = new SockJS('/ws');
    var stompClient = Stomp.over(socket);

    // Отключаем лишние логи
    stompClient.debug = null;

    // Флаг, чтобы не перезагружаться сразу после своего же действия
    var isJustSubmitted = false;

    // Слушаем отправку форм на странице
    document.addEventListener('submit', function() {
        isJustSubmitted = true;
        // Сбрасываем флаг через 3 секунды (время на редирект и загрузку новой страницы)
        setTimeout(function() { isJustSubmitted = false; }, 3000);
    });

    stompClient.connect({}, function (frame) {
        console.log('Connected: ' + frame);
        stompClient.subscribe('/topic/updates', function (message) {
            console.log('Received update: ' + message.body);

            // Если мы только что что-то отправили, не перезагружаемся,
            // так как редирект сам обновит данные.
            // Это предотвращает конфликт редиректа и reload().
            if (!isJustSubmitted) {
                location.reload();
            }
        });
    });

    // Обработка ошибок соединения (чтобы не спамить в консоль)
    socket.onerror = function() {};
    /*]]>*/
  </script>

</head>
<body>
<div class="sidebar">
  <h3>Бассейн</h3>
  <span class="subtitle">Админ-панель</span>


  <div th:if="${role != null and (role.name() == 'ADMIN' or role.name() == 'COACH')}">
    <a href="/schedule" th:classappend="${activePage == 'schedule'} ? 'active'">Расписание</a>
    <a href="/groups" th:classappend="${activePage == 'groups'} ? 'active'">Группы</a>
    <a href="/parents" th:classappend="${activePage == 'parents'} ? 'active'">Родители</a>


    <a href="/certificates" th:classappend="${activePage == 'certificates'} ? 'active'" style="position: relative;">
      Справки
      <span th:if="${unreadCertsCount != null and unreadCertsCount > 0}"
            style="position: absolute; top: 5px; right: 10px; background: red; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center;"
            th:text="${unreadCertsCount}"></span>
    </a>

    <a href="/broadcast" th:classappend="${activePage == 'broadcast'} ? 'active'">Рассылка</a>
  </div>


  <div th:if="${role != null and role.name() == 'ADMIN'}">
    <a href="/join-requests" th:classappend="${activePage == 'join-requests'} ? 'active'">Заявки в группы</a>
    <a href="/users" th:classappend="${activePage == 'users'} ? 'active'">Персонал</a>
    <a href="/pools" th:classappend="${activePage == 'pools'} ? 'active'">Бассейны</a>
    <a href="/calendar" th:classappend="${activePage == 'calendar'} ? 'active'">Календарь</a>
    <a href="/documents" th:classappend="${activePage == 'documents'} ? 'active'">Документы</a>
    <a href="/logs" th:classappend="${activePage == 'logs'} ? 'active'">Логи</a>
  </div>

  <!-- Вкладки для бухгалтера -->
  <div th:if="${role != null and role.name() == 'ACCOUNTANT'}">
    <a href="/payments" th:classappend="${activePage == 'payments'} ? 'active'">Оплаты</a>
    <a href="/payment-receipts" th:classappend="${activePage == 'payment-receipts'} ? 'active'">Квитанции</a>
    <a href="/payments/settings" th:classappend="${activePage == 'payment-settings'} ? 'active'">Настройка оплат</a>
  </div>

  <div style="margin-top: auto;">
    <p style="font-size: 0.85em; color: #959da5; margin-bottom: 10px; text-align: center;" th:text="${fullName}"></p>

    <a href="/logout" class="logout-link">Выйти</a>
  </div>
</div>
<div class="main-content">
  <div th:replace="${content}"></div>
</div>
</body>
</html>
