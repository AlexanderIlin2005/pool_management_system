<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
  <title th:text="${title}">Admin</title>
  <style>
    body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background-color: #f8f9fa; }

    .sidebar {
        width: 250px;
        background-color: #ffffff;
        border-right: 1px solid #e1e4e8;
        padding: 20px;
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 5px rgba(0,0,0,0.03);
    }
    .sidebar h3 { color: #2c3e50; margin-bottom: 30px; font-size: 1.2em; text-transform: uppercase; letter-spacing: 1px; }

    .sidebar a {
        color: #586069;
        text-decoration: none;
        padding: 12px 15px;
        margin-bottom: 5px;
        display: block;
        transition: 0.2s;
        border-radius: 6px;
        font-weight: 500;
    }
    .sidebar a:hover { background-color: #f1f3f5; color: #0366d6; }
    .sidebar a.active { background-color: #ebf5ff; color: #0366d6; font-weight: 600; }

    .main-content { flex-grow: 1; padding: 40px; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; margin-bottom: 30px; align-items: center; }

    .btn { padding: 8px 16px; background: #0366d6; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; font-size: 0.9em; transition: 0.2s; }
    .btn:hover { background: #0255b3; }
    .btn-danger { background: #dc3545; color: white !important; }
    .btn-danger:hover { background: #bb2d3b; }
  </style>
</head>
<body>
<div class="sidebar">
  <h3>Pool Admin</h3>

  <!-- Ссылки видны ТОЛЬКО администратору -->
  <div th:if="${role != null and role.name() == 'ADMIN'}">
    <a href="/dashboard" th:classappend="${activePage == 'dashboard'} ? 'active'">Дэшборд</a>
    <a href="/groups" th:classappend="${activePage == 'groups'} ? 'active'">Группы</a>
  </div>

  <div style="margin-top: auto;">
    <p style="font-size: 0.85em; color: #959da5; margin-bottom: 10px;" th:text="${fullName}"></p>
    <a href="/logout" class="btn btn-danger" style="display: inline-block; width: 100%; text-align: center;">Выйти</a>
  </div>
</div>
<div class="main-content">
  <div th:replace="${content}"></div>
</div>
</body>
</html>
