<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
  <title th:text="${title}">Admin</title>
  <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
        background-color: #f8f9fa;
    }

    .sidebar {
        width: 250px;
        background-color: #ffffff;
        border-right: 1px solid #e1e4e8;
        padding: 20px;
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 5px rgba(0,0,0,0.03);
        overflow-y: auto;
    }

    .sidebar h3 {
        color: #2c3e50;
        margin-bottom: 5px;
        font-size: 1.4em;
        font-weight: bold;
    }
    .sidebar .subtitle {
        color: #959da5;
        font-size: 0.9em;
        margin-bottom: 30px;
        display: block;
    }

    .sidebar a {
        color: #586069;
        text-decoration: none;
        padding: 10px 15px;
        margin-bottom: 3px;
        display: block;
        transition: 0.2s;
        border-radius: 6px;
        font-weight: 500;
        font-size: 0.95em;
        position: relative; /* Добавлено для позиционирования счетчиков */
    }
    .sidebar a:hover { background-color: #f1f3f5; color: #0366d6; }
    .sidebar a.active { background-color: #ebf5ff; color: #0366d6; font-weight: 600; }

    /* Единый стиль для всех счетчиков */
    .badge-counter {
        position: absolute;
        top: 5px;
        right: 10px;
        background: red;
        color: white;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
    }

    .main-content { flex-grow: 1; padding: 40px; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; margin-bottom: 30px; align-items: center; }

    .btn {
        padding: 8px 16px;
        background: #0366d6;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-size: 0.9em;
        transition: 0.2s;
        display: inline-block;
    }
    .btn:hover { background: #0255b3; }

    .btn-danger {
    background-color: #dc3545 !important;
    color: white !important;
    }

    .btn-danger:hover {
    background-color: #bb2d3b !important;
    }

    .logout-link {
        margin-top: 10px;
        background-color: #dc3545 !important;
        color: white !important;
        text-align: center;
        font-weight: 600;
        display: block;
    }
    .logout-link:hover {
        background-color: #bb2d3b !important;
        color: white !important;
    }
  </style>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.toggle-certificate-btn').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.preventDefault();

                const childId = this.getAttribute('data-child-id');
                const childName = this.getAttribute('data-child-name');
                const currentStatus = this.getAttribute('data-current-status') === 'true';

                const confirmMessage = currentStatus
                    ? 'Вы уверены, что хотите снять отметку о получении оригинала справки для ребенка ' + childName + '?'
                    : 'Вы уверены, что хотите отметить получение оригинала справки для ребенка ' + childName + '?';

                if (confirm(confirmMessage)) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/children/certificate/toggle/' + childId;
                    document.body.appendChild(form);
                    form.submit();
                }
            });
        });
    });
  </script>


  <script>
    // =============================================
    // АВТО-ОБНОВЛЕНИЕ СТРАНИЦ (каждые 30 секунд)
    // Исключаем страницы с формами
    // =============================================
    document.addEventListener('DOMContentLoaded', function() {
        var excludedPaths = [
            /^\/groups\/new$/,
            /^\/groups\/edit\/\d+$/,
            /^\/pools\/new$/,
            /^\/pools\/edit\/\d+$/,
            /^\/users\/register$/,
            /^\/users\/edit\/\d+$/,
            /^\/calendar$/,
            /^\/broadcast$/,
            /^\/attendance\/mark\/\d+$/,
            /^\/children\/skill\/edit\/\d+$/,
            /^\/children\/profile\/\d+$/,
            /^\/parents\/edit\/\d+$/,
            /^\/documents$/,
            /^\/payment-receipts$/,
            /^\/payments$/,
            /^\/payments\/settings$/,
            /^\/join-requests\/\d+$/,
        ];

        var currentPath = window.location.pathname;
        var isExcluded = false;

        for (var i = 0; i < excludedPaths.length; i++) {
            if (excludedPaths[i].test(currentPath)) {
                isExcluded = true;
                break;
            }
        }

        if (!isExcluded) {
            console.log('🔄 Авто-обновление включено для:', currentPath);
            setInterval(function() {
                location.reload();
            }, 30000);
        } else {
            console.log('⏸️ Авто-обновление ОТКЛЮЧЕНО для:', currentPath);
        }
    });
  </script>

</head>
<body>
<div class="sidebar">
  <h3>Бассейн</h3>
  <span class="subtitle">Админ-панель</span>

  <div th:if="${role != null and (role.name() == 'ADMIN' or role.name() == 'COACH')}">
    <a href="/schedule" th:classappend="${activePage == 'schedule'} ? 'active'">Расписание</a>
    <a href="/groups" th:classappend="${activePage == 'groups'} ? 'active'">Группы</a>
    <a href="/parents" th:classappend="${activePage == 'parents'} ? 'active'">Родители</a>

    <a href="/messages" th:classappend="${activePage == 'messages'} ? 'active'">
      Сообщения
      <span th:if="${unreadMessagesCount != null and unreadMessagesCount > 0}"
            class="badge-counter"
            th:text="${unreadMessagesCount}"></span>
    </a>

    <a href="/certificates" th:classappend="${activePage == 'certificates'} ? 'active'">
      Справки
      <span th:if="${unreadCertsCount != null and unreadCertsCount > 0}"
            class="badge-counter"
            th:text="${unreadCertsCount}"></span>
    </a>

    <a href="/absences" th:classappend="${activePage == 'absences'} ? 'active'">
      Пропуски (без справок)
      <span th:if="${unreadAbsencesCount != null and unreadAbsencesCount > 0}"
            class="badge-counter"
            th:text="${unreadAbsencesCount}"></span>
    </a>

    <a href="/broadcast" th:classappend="${activePage == 'broadcast'} ? 'active'">Рассылка</a>
  </div>

  <div th:if="${role != null and role.name() == 'ADMIN'}">
    <a href="/join-requests" th:classappend="${activePage == 'join-requests'} ? 'active'">
      Заявки в группы
      <span th:if="${unreadJoinRequestsCount != null and unreadJoinRequestsCount > 0}"
            class="badge-counter"
            th:text="${unreadJoinRequestsCount}"></span>
    </a>

    <a href="/subscription-types" th:classappend="${activePage == 'subscription-types'} ? 'active'">
      Типы абонементов
    </a>

    <a href="/users" th:classappend="${activePage == 'users'} ? 'active'">Персонал</a>
    <a href="/pools" th:classappend="${activePage == 'pools'} ? 'active'">Бассейны</a>
    <a href="/calendar" th:classappend="${activePage == 'calendar'} ? 'active'">Календарь</a>
    <a href="/documents" th:classappend="${activePage == 'documents'} ? 'active'">Документы</a>
    <a href="/logs" th:classappend="${activePage == 'logs'} ? 'active'">Логи</a>
  </div>

  <!-- Бухгалтерские разделы доступны и ADMIN, и ACCOUNTANT -->
  <div th:if="${role != null and (role.name() == 'ADMIN' or role.name() == 'ACCOUNTANT')}">
    <a href="/payments" th:classappend="${activePage == 'payments'} ? 'active'">
      Оплаты
    </a>
    <a href="/payment-receipts" th:classappend="${activePage == 'payment-receipts'} ? 'active'">
      Квитанции
      <span th:if="${unreadReceiptsCount != null and unreadReceiptsCount > 0}"
            class="badge-counter"
            th:text="${unreadReceiptsCount}"></span>
    </a>
    <a href="/payments/settings" th:classappend="${activePage == 'payment-settings'} ? 'active'">Настройка оплат</a>
  </div>

  <!-- Отчеты - используем th:class с условием -->
  <div th:if="${role != null and (role.name() == 'ADMIN' or role.name() == 'ACCOUNTANT')}">
    <a href="/reports"
       th:classappend="${(activePage == 'reports' or activePage == 'report-payments') ? 'active' : ''}">
      Отчеты
    </a>
  </div>

  <div style="margin-top: auto;">
    <p style="font-size: 0.85em; color: #959da5; margin-bottom: 10px; text-align: center;" th:text="${fullName}"></p>
    <a href="/logout" class="logout-link">Выйти</a>
  </div>
</div>
<div class="main-content">
  <div th:replace="${content}"></div>
</div>
</body>
</html>
