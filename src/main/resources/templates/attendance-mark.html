<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Отметить посещение', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="card" style="max-width: 900px; margin: 0 auto;">
        <h2>Отметка посещаемости</h2>
        <p style="color: #666;">
            Группа: <strong th:text="${lesson.group.name}"></strong> |
            Дата: <strong th:text="${#temporals.format(lesson.lessonDate, 'dd.MM.yyyy')}"></strong> |
            Время: <strong th:text="${lesson.startTime} + ' - ' + ${lesson.endTime}"></strong>
        </p>

        <div th:if="${param.success}" style="background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
            Посещаемость успешно сохранена!
        </div>

        <div th:if="${param.partial}" style="background: #fff3cd; color: #856404; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
            ⚠️ Часть детей не отмечена. Они останутся без статуса.
        </div>

        <form th:action="@{/attendance/save/{id}(id=${lesson.id})}" method="post" id="attendanceForm">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                <tr style="background: #f8f9fa;">
                    <th style="padding: 10px; text-align: left;">Ребенок</th>
                    <th style="padding: 10px; text-align: center;">Статус</th>
                    <th style="padding: 10px;">Комментарий</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="child : ${children}" style="border-bottom: 1px solid #eee;">
                    <td style="padding: 10px;" th:text="${child.lastName} + ' ' + ${child.firstName}"></td>
                    <td style="padding: 10px; text-align: center;">
                        <!-- УБРАН required -->
                        <select th:name="'marks[' + ${child.id} + ']'" style="padding: 5px; border-radius: 4px;">
                            <option value="">Не выбрано</option>
                            <option th:each="status : ${T(ru.sashil.admin.model.Attendance.Status).values()}"
                                    th:value="${status}" th:text="${status.label}"
                                    th:selected="${currentMarks[child.id] == status}">
                            </option>
                        </select>
                    </td>
                    <td style="padding: 10px;">
                        <input type="text" th:name="'comments[' + ${child.id} + ']'"
                               th:value="${currentComments != null and currentComments.containsKey(child.id) ? currentComments[child.id] : ''}"
                               style="width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 4px;">
                    </td>
                </tr>
                </tbody>
            </table>

            <div style="margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 4px;">
                <label style="cursor: pointer;">
                    <input type="checkbox" id="skipUnmarked" onclick="toggleSkipWarning()">
                    Отметить всех остальных как "Отсутствует"
                </label>
                <span style="font-size: 0.85em; color: #6c757d; margin-left: 10px;">
                    (если галочка не стоит, неотмеченные дети останутся без статуса)
                </span>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="submit" class="btn" onclick="return confirmSubmit()">Сохранить посещаемость</button>
                <a href="/schedule" class="btn" style="background: #6c757d;">Назад к расписанию</a>
            </div>
        </form>
    </div>

    <script>
        function toggleSkipWarning() {
            var checkbox = document.getElementById('skipUnmarked');
            var warning = document.getElementById('partialWarning');
            if (checkbox.checked) {
                if (warning) warning.style.display = 'none';
            }
        }

        function confirmSubmit() {
            var checkbox = document.getElementById('skipUnmarked');
            var selects = document.querySelectorAll('select[name^="marks["]');
            var unmarkedCount = 0;

            selects.forEach(function(select) {
                if (select.value === '') {
                    unmarkedCount++;
                }
            });

            if (unmarkedCount > 0 && !checkbox.checked) {
                return confirm(
                    '⚠️ ' + unmarkedCount + ' детей не отмечены.\n\n' +
                    'Они останутся без статуса посещаемости.\n\n' +
                    'Если хотите отметить их как "Отсутствует", поставьте галочку "Отметить всех остальных как Отсутствует".\n\n' +
                    'Продолжить?'
                );
            }

            if (checkbox.checked) {
                // Отмечаем всех неотмеченных как ABSENT
                selects.forEach(function(select) {
                    if (select.value === '') {
                        // Находим опцию "ABSENT"
                        var options = select.options;
                        for (var i = 0; i < options.length; i++) {
                            if (options[i].value === 'ABSENT') {
                                options[i].selected = true;
                                break;
                            }
                        }
                    }
                });
            }

            return true;
        }
    </script>
</div>
</body>
</html>
