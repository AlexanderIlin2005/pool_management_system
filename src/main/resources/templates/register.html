<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация администратора</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        .box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        input, select { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .error { color: red; font-size: 0.9em; margin-bottom: 10px; }
        .link { text-align: center; margin-top: 15px; font-size: 0.9em; }
        .link a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
<div class="box">
    <h2>Регистрация сотрудника</h2>
    <form th:action="@{/register}" method="post">
        <input type="text" name="fullName" placeholder="ФИО (например, Иванов И.И.)" required>
        <input type="text" name="login" placeholder="Логин" required>
        <input type="password" name="password" placeholder="Пароль" required>

        <label for="role">Выберите роль:</label>
        <select name="role" id="role" required>
            <option value="" disabled selected>Выберите роль...</option>
            <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
        </select>

        <button type="submit">Зарегистрироваться</button>
    </form>
    <p th:if="${error}" class="error" th:text="${error}"></p>

    <div class="link">
        Уже есть аккаунт? <a href="/login">Войти</a>
    </div>
</div>
</body>
</html>
