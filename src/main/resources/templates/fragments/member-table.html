<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- ТОЛЬКО ТАБЛИЦА РЕЗУЛЬТАТОВ -->
<div th:fragment="tableContent">
    <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
        <thead>
        <tr style="background: #eef2f5; text-align: left;">
            <th style="padding: 10px; border: 1px solid #ddd;">ФИО</th>
            <th style="padding: 10px; border: 1px solid #ddd;">Возраст</th>
            <th style="padding: 10px; border: 1px solid #ddd;">Класс</th>
            <th style="padding: 10px; border: 1px solid #ddd;">Навык</th>
            <th style="padding: 10px; border: 1px solid #ddd; width: 150px;">Действие</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="child : ${availableChildren}">
            <td style="padding: 10px; border: 1px solid #ddd;">
                <a th:href="@{/children/skill/edit/{id}(id=${child.id})}"
                   th:text="${child.last_name} + ' ' + ${child.first_name}"
                   style="color: #007bff; text-decoration: none;"></a>
            </td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${child.age}"></td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${child.grade_number}"></td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${child.skill}"></td>
            <td style="padding: 10px; border: 1px solid #ddd;">
                <form th:action="@{/groups/{id}/members/add(id=${group.id})}" method="post" class="add-member-form">
                    <input type="hidden" name="childId" th:value="${child.id}">
                    <!-- Сохраняем фильтры в скрытых полях -->
                    <input type="hidden" name="search" th:value="${currentSearch}">
                    <input type="hidden" name="ageFrom" th:value="${currentAgeFrom}">
                    <input type="hidden" name="ageTo" th:value="${currentAgeTo}">
                    <input type="hidden" name="gradeFrom" th:value="${currentGradeFrom}">
                    <input type="hidden" name="gradeTo" th:value="${currentGradeTo}">
                    <th:block th:each="skill : ${currentSkills}">
                        <input type="hidden" name="skills" th:value="${skill}">
                    </th:block>
                    <button type="submit" class="btn add-member-btn" style="padding: 4px 8px; font-size: 0.8em; background-color: #28a745;">Добавить</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(availableChildren)}">
            <td colspan="5" style="text-align: center; padding: 10px; color: #666;">Нет детей, соответствующих критериям</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
